# Configuração de deploy no Netlify (site estático, sem funções nem variáveis secretas).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requer Node 20.19+ ou 22.12+.
  NODE_VERSION = "22"

# Aplicação de página única: todas as rotas servem o index.html (ex.: /planos, /conta/recompensas).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
